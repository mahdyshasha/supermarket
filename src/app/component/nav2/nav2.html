    <div class="auth-buttons">
  

@if (isModalOpen) {
  <div class="modal-overlay" (click)="closeRegisterModal()">
    <div class="modal-content" (click)="$event.stopPropagation()">
      <div class="modal-header">
        <h3>إنشاء حساب جديد</h3>
        <button class="close-btn" (click)="closeRegisterModal()">&times;</button>
      </div>
      
      <form class="register-form">
        <div class="form-group">
          <label><span class="material-icons">email</span> البريد الإلكتروني</label>
          <input type="email" placeholder="example@mail.com">
        </div>

        <div class="form-group">
          <label><span class="material-icons">lock</span> كلمة المرور</label>
          <input type="password" placeholder="••••••••">
        </div>

        <button type="submit" class="submit-btn">تسجيل الآن</button>
      </form>
      
      <p class="switch-auth">
  لديك حساب بالفعل؟ 
  <a [routerLink]="['/login']" (click)="closeRegisterModal()">تسجيل الدخول</a>
</p>
    </div>
  </div>
}
<div class="auth-buttons">
 @if (!displayName || displayName === 'Log In') {
      <button (click)="openRegisterModal()" class="btn-nav btn-register">
        <span class="material-icons">person_add</span> Register
      </button>

      <a [routerLink]="'/login'" class="btn-nav btn-login">
        <span class="material-icons">login</span> Login
      </a>
    } 
    
   @else {
        <button mat-button [matMenuTriggerFor]="userMenu" class="user-profile-btn">
          <mat-icon>account_circle</mat-icon>
          {{ displayName }}
          <mat-icon>arrow_drop_down</mat-icon>
        </button>

        <mat-menu #userMenu="matMenu">
          <button mat-menu-item [routerLink]="['/fault']">
            <mat-icon>person</mat-icon>
            <span>الملف الشخصي</span>
          </button>
          <hr>
          <button mat-menu-item (click)="logout()">
            <mat-icon color="warn">logout</mat-icon>
            <span style="color: red;">تسجيل الخروج</span>
          </button>
        </mat-menu>
      }
</div>
   <a (click)="openContactModal()" class="connect-link" style="cursor: pointer;">
  <span class="material-icons">support_agent</span>
  Connect
</a>

<div class="contact-modal" [class.active]="shasha">
  <div class="modal-content">
    <div class="modal-header">
      <h3>أرسل لنا رسالة مباشرة</h3>
      <button class="close-btn" (click)="closeContactModal()">&times;</button>
    </div>
    
    <form >
      <div class="input-group">
        <textarea name="message" id="msgText" rows="6" required placeholder="اكتب رسالتك هنا..."></textarea>
      </div>
      
      <div class="modal-actions">
        <button type="button" class="btn-cancel" >إلغاء</button>
        <button type="submit" class="btn-send" >
          إرسال الآن
          <span class="material-icons" style="font-size: 16px;">send</span>
        </button>
      </div>
    </form>
  </div>
</div>
  </div>
