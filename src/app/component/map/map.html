<div class="main-layout-wrapper">
  
  <div class="map-side">
    <iframe 
      [src]="currentMapUrl" 
      width="100%" 
      height="100%" 
      style="border:0;" 
      allowfullscreen="" 
      loading="lazy">
    </iframe>
  </div>

  <div class="list-side">
    <div class="header-box">
      <h2>فروعنا المعتمدة</h2>
    </div>

    <div class="cards-list">
      @for (branch of branches; track branch.id) {
        <div class="luxury-card" 
             (click)="updateMap(branch.embedUrl, branch.id)"
             [class.active]="activeBranchId === branch.id">
          <div class="card-body">
            <h3>{{ branch.name }}</h3>
            <p>{{ branch.address }}</p>
          </div>
          <span class="material-icons">chevron_left</span>
        </div>
      }
    </div>
  </div>

</div>
